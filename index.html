<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foundation Finder — Dev Fixture</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
        background: #f9fafb;
      }
      h1 { font-size: 24px; margin-bottom: 16px; color: #111827; }
    </style>
  </head>
  <body>
    <h1>Foundation Finder — Dev Fixture</h1>

    <!--
      Mock Webflow CMS collection list.
      In production, Webflow renders this server-side and the script hides it.
      Here we include it directly so npm run dev works without Webflow.
    -->
    <div style="display:none">
      <!-- 1: HealthWell Foundation — Open, Medicare, $6,000 -->
      <div
        data-ff-program
        data-ff-program-id="healthwell-neurocognitive-disease-with-psychosis-medicare-access"
        data-ff-foundation-name="HealthWell Foundation"
        data-ff-program-name="Neurocognitive Disease with Psychosis - Medicare Access"
        data-ff-description="Assistance for the treatment of psychosis in patients previously diagnosed with any one of the following neurocognitive diseases: Alzheimer's/Dementia, Parkinson's Disease, Diffuse Lewy Body Disease, Frontotemporal Lobar Degeneration, Huntington's Disease, Prion/Creutzfeldt-Jakob Disease, Traumatic Brain Injury. Covers prescription drug copays or Medicare Part B insurance premiums."
        data-ff-status="Open"
        data-ff-last-updated="2026-08-26"
        data-ff-disease-indications="Alzheimer's Disease, Dementia, Psychosis associated with neurocognitive disease, Parkinson's Disease, Diffuse Lewy Body Disease, Frontotemporal Lobar Degeneration, Huntington's Disease, Prion/Creutzfeldt-Jakob Disease, Traumatic Brain Injury"
        data-ff-insurance-types="Medicare"
        data-ff-insurance-description="Medicare required (Medicare Access Fund); Medicare Part B required for premium assistance"
        data-ff-grant-amount="$6,000"
        data-ff-apply-url="https://healthwellfoundation.my.salesforce-sites.com/onlineapplication?fund=a1Z4w00000TgqqTEAR"
        data-ff-program-url="https://www.healthwellfoundation.org/fund/neurocognitive-disease-with-psychosis-medicare-access/"
        data-ff-foundation-url="https://www.healthwellfoundation.org/"
        data-ff-contact-email=""
        data-ff-contact-phone="800-675-8416"
        data-ff-metadata='[{"label":"Eligibility Requirements","value":"Being treated for neurocognitive disease with psychosis, diagnosis verified by prescriber; Have Medicare (Part B required for premium assistance); Income within guidelines; Receiving treatment in the United States"},{"label":"Income Limits","value":"500% of the Federal Poverty Level, adjusted for household size and high cost-of-living areas"},{"label":"Assistance Type","value":"Prescription drug copay OR insurance premium (Medicare Part B only)"},{"label":"Grant Cycle","value":"12 months"},{"label":"Forecasted Average Grant Utilization","value":"$2,500"}]'
      ></div>

      <!-- 2: Patient Advocate Foundation (TotalAssist) — Closed, Medicare/Medicaid/Military -->
      <div
        data-ff-program
        data-ff-program-id="totalassist-alzheimers-disease-health-equity-fund"
        data-ff-foundation-name="Patient Advocate Foundation (TotalAssist)"
        data-ff-program-name="Alzheimer's Disease Health Equity Fund"
        data-ff-description="Alzheimer's disease is a progressive, incurable, degenerative disorder that attacks the brain's nerve cells, or neurons, resulting in loss of memory, thinking and language skills, and behavioral changes. Health Equity Funds serve people living in counties identified by the CDC as having the highest social vulnerability scores and high rates of chronic disease. The fund covers co-pay, co-insurance and deductible costs (medications and office visits) and medical insurance premiums."
        data-ff-status="Closed"
        data-ff-last-updated="2026-08-26"
        data-ff-disease-indications="Alzheimer's Disease"
        data-ff-insurance-types="Medicare, Medicaid, Military Benefits"
        data-ff-insurance-description="Medicare, Medicaid, or Military Benefits (government-insured coverage that covers qualifying expenses)"
        data-ff-grant-amount="Varies by fund - see program page"
        data-ff-apply-url=""
        data-ff-program-url="https://totalassist.org/funds/alzheimers-disease-health-equity/"
        data-ff-foundation-url="https://www.patientadvocate.org/"
        data-ff-contact-email=""
        data-ff-contact-phone="866-512-3861"
        data-ff-metadata='[{"label":"Status Detail","value":"Closed to new and renewal applications due to lack of sufficient funding; patients with an active award continue to be supported; funds reopen often"},{"label":"Eligibility Requirements","value":"Confirmed diagnosis and in treatment; government-insured coverage; income at or below 500% FPL; legal U.S. resident; home address in a ZIP code served by a Health Equity Fund"},{"label":"Income Limits","value":"At or below 500% of the Federal Poverty Level adjusted for regional Cost of Living Index"},{"label":"Organizational Change","value":"Patient Advocate Foundation and PAN Foundation completed a strategic merger in March 2026; the unified TotalAssist program launched July 1, 2026"}]'
      ></div>

      <!-- 3: HFC Respite Care Grants — Open, no insurance, in-kind -->
      <div
        data-ff-program
        data-ff-program-id="hfc-respite-care-grants"
        data-ff-foundation-name="HFC (Hilarity for Charity)"
        data-ff-program-name="Respite Care Grants (Recharge Grant / Adult Day Center Respite Grant)"
        data-ff-description="HFC awards respite care grants to those providing care to their loved ones living with Alzheimer's disease or other dementias. The respite care grants are awarded across the United States and Canada. HFC respite grants cover the cost of professional, in-home or Adult Day Center care."
        data-ff-status="Open"
        data-ff-last-updated="2026-08-26"
        data-ff-disease-indications="Alzheimer's Disease, Frontotemporal Dementia, Lewy Body Dementia, Vascular Dementia, Mixed and Other Dementias, Parkinson's-Related Dementia"
        data-ff-insurance-types=""
        data-ff-insurance-description=""
        data-ff-grant-amount="In-kind care: Recharge Grant = 100 hours of respite care; Adult Day Center Respite Grant = 24 days"
        data-ff-apply-url="https://helpforalzheimersfamilies.submittable.com/submit"
        data-ff-program-url="https://wearehfc.org/care-grants/"
        data-ff-foundation-url="https://wearehfc.org/"
        data-ff-contact-email=""
        data-ff-contact-phone=""
        data-ff-metadata='[{"label":"Eligibility Requirements","value":"Person cared for must have a dementia diagnosis and currently live at home with the caregiver; caregiver must be facing financial and emotional hardship; must reside in the United States or Canada"},{"label":"Income Limits","value":"No specific published income threshold; financial and emotional need assessed"},{"label":"Important Restriction","value":"Grants provide professional in-home or adult day center care only and have NO CASH VALUE"},{"label":"Award Usage Window","value":"Recharge Grant: 100 hours within 3 months of award. Adult Day Center Respite Grant: 24 days within 3 months of first date of care"}]'
      ></div>

      <!-- 4: HFC Emergency Relief Grants — Open, no insurance, $1,500 cash -->
      <div
        data-ff-program
        data-ff-program-id="hfc-emergency-relief-grants"
        data-ff-foundation-name="HFC (Hilarity for Charity)"
        data-ff-program-name="Emergency Relief Grants"
        data-ff-description="HFC is committed to supporting dementia family caregivers impacted by natural and other disasters. Emergency Relief Grants are designated as $1,500 cash grants to families who are most affected by natural or geographic disasters, helping them continue their vital caregiving responsibilities during times of crisis. Official disaster declarations must be in place from FEMA, state, or local government to qualify."
        data-ff-status="Open"
        data-ff-last-updated="2026-08-26"
        data-ff-disease-indications="Alzheimer's Disease, Dementia"
        data-ff-insurance-types=""
        data-ff-insurance-description=""
        data-ff-grant-amount="$1,500"
        data-ff-apply-url="https://helpforalzheimersfamilies.submittable.com/submit"
        data-ff-program-url="https://helpforalzheimersfamilies.submittable.com/submit"
        data-ff-foundation-url="https://wearehfc.org/"
        data-ff-contact-email=""
        data-ff-contact-phone=""
        data-ff-metadata='[{"label":"Eligibility Requirements","value":"Dementia family caregiver affected by a natural or geographic disaster; an official disaster declaration must be in place from FEMA, state, or local government"},{"label":"Award Type","value":"One-time cash grant"},{"label":"Discretion","value":"Grants issued at the discretion of HFC"}]'
      ></div>

      <!-- 5: CMS GUIDE Model — Government Program, Medicare, up to $2,625/yr -->
      <div
        data-ff-program
        data-ff-program-id="cms-guide-model"
        data-ff-foundation-name="Centers for Medicare &amp; Medicaid Services (CMS) Innovation Center"
        data-ff-program-name="GUIDE Model (Guiding an Improved Dementia Experience)"
        data-ff-description="Launched July 1, 2024, the GUIDE Model tests a new payment approach for key supportive services furnished to people living with dementia, including comprehensive person-centered assessments and care plans; care coordination; 24/7 access to an interdisciplinary care team member or help line; and certain respite services to support caregivers."
        data-ff-status="Government Program"
        data-ff-last-updated="2026-08-26"
        data-ff-disease-indications="Dementia, Alzheimer's Disease"
        data-ff-insurance-types="Medicare"
        data-ff-insurance-description="Medicare required. Beneficiary must have Medicare Parts A and B with Medicare as primary payer; not enrolled in Medicare Advantage, PACE, or the Medicare hospice benefit"
        data-ff-grant-amount="Up to $2,625 per year for respite services"
        data-ff-apply-url="https://www.cms.gov/priorities/innovation/innovation-models/guide"
        data-ff-program-url="https://www.cms.gov/priorities/innovation/innovation-models/guide"
        data-ff-foundation-url="https://www.cms.gov/"
        data-ff-contact-email=""
        data-ff-contact-phone="1-800-633-4227"
        data-ff-metadata='[{"label":"Eligibility Requirements","value":"Attested dementia diagnosis by a participating clinician; enrolled in Original Medicare (Parts A and B) with Medicare as primary payer; not in Medicare Advantage, PACE, or hospice"},{"label":"Income Limits","value":"None"},{"label":"How to Access","value":"Enroll through a participating GUIDE dementia care program; available in 47 states"},{"label":"Model Duration","value":"8 years, launched July 1, 2024"}]'
      ></div>

      <!-- 6: Extra Help (Medicare Part D LIS) — Government Program, Medicare, ~$5,700/yr -->
      <div
        data-ff-program
        data-ff-program-id="ssa-extra-help-medicare-part-d-lis"
        data-ff-foundation-name="Social Security Administration (SSA) / Centers for Medicare &amp; Medicaid Services (CMS)"
        data-ff-program-name="Extra Help (Medicare Part D Low-Income Subsidy, LIS)"
        data-ff-description="Extra Help is a federal program that helps pay for some to most of the out-of-pocket costs of Medicare prescription drug coverage. It is also known as the Part D Low-Income Subsidy (LIS). With Extra Help, both the Part D deductible and plan premium are waived, and prescription copays are capped. People with full Medicaid coverage, Supplemental Security Income, or a Medicare Savings Program are deemed automatically eligible."
        data-ff-status="Government Program"
        data-ff-last-updated="2026-08-26"
        data-ff-disease-indications=""
        data-ff-insurance-types="Medicare"
        data-ff-insurance-description="Medicare required. Must be enrolled in a Medicare Part D prescription drug plan or a Medicare Advantage plan with drug coverage"
        data-ff-grant-amount="Estimated average annual value of approximately $5,700 per person"
        data-ff-apply-url="https://www.ssa.gov/medicare/part-d-extra-help"
        data-ff-program-url="https://www.ncoa.org/article/understanding-medicare-part-d-low-income-subsidy-lis-extra-help/"
        data-ff-foundation-url="https://www.ssa.gov/"
        data-ff-contact-email=""
        data-ff-contact-phone="1-800-772-1213"
        data-ff-metadata='[{"label":"Eligibility Requirements","value":"Enrolled in Medicare with Part D drug coverage; income and resources within limits; automatic eligibility for people with full Medicaid, SSI, or a Medicare Savings Program"},{"label":"Income Limits","value":"2026: annual income at or below approximately $23,475 for an individual and $31,725 for a married couple (150% of FPL)"},{"label":"Resource Limits","value":"2026: $16,590 individual / $33,100 married"},{"label":"Important Note","value":"Federal anti-kickback law bars manufacturer copay cards for Medicare enrollees; Extra Help and charitable foundations are the primary options"}]'
      ></div>

      <!-- 7: Dementia Alliance of North Carolina — Open, no insurance, $500 -->
      <div
        data-ff-program
        data-ff-program-id="dementia-alliance-nc-caregiver-assistance-fund"
        data-ff-foundation-name="Dementia Alliance of North Carolina"
        data-ff-program-name="Caregiver Assistance Fund (Caregiver Assistance Program)"
        data-ff-description="The Dementia Alliance Caregiver Assistance Program is designed to support family caregivers throughout the state by awarding up to $500 in financial assistance or reimbursement during a time of need, allowing caregivers temporary relief (respite). Funds received may be used to hire a Home Health Agency or a private caregiver. Services must start within 30 days of approval and be completed within 90 days."
        data-ff-status="Open"
        data-ff-last-updated="2026-08-26"
        data-ff-disease-indications="Dementia"
        data-ff-insurance-types=""
        data-ff-insurance-description="Not eligible for those who have been approved for or are receiving Medicaid"
        data-ff-grant-amount="$500"
        data-ff-apply-url="https://dementianc.org/helpsupport/caregiverassistancefund/"
        data-ff-program-url="https://dementianc.org/helpsupport/caregiverassistancefund/"
        data-ff-foundation-url="https://dementianc.org/"
        data-ff-contact-email=""
        data-ff-contact-phone="919-832-3732"
        data-ff-metadata='[{"label":"Eligibility Requirements","value":"Caregiver and the person living with dementia must both reside in North Carolina; the person living with dementia must not be living full-time in a facility"},{"label":"Exclusions","value":"Not for those approved for or receiving Medicaid; not for caregivers of individuals living full-time in a facility"},{"label":"Frequency Limit","value":"No more than one award per fiscal year (July - June) and not within 6 months of receiving previous funds"},{"label":"Geography","value":"North Carolina only"}]'
      ></div>

      <!-- 8: BenefitsCheckUp (NCOA) — Resource navigator, no insurance, no grant amount -->
      <div
        data-ff-program
        data-ff-program-id="ncoa-benefitscheckup"
        data-ff-foundation-name="National Council on Aging (NCOA)"
        data-ff-program-name="BenefitsCheckUp"
        data-ff-description="BenefitsCheckUp is NCOA's free, confidential online screening tool that helps older adults, caregivers and professionals quickly determine eligibility for programs that offset the cost of medicine, food, household utilities and more. The tool features over 2,000 public and private benefits programs across all 50 states and the District of Columbia, matching users with programs based on their financial situation and location."
        data-ff-status="Open"
        data-ff-last-updated="2026-08-26"
        data-ff-disease-indications=""
        data-ff-insurance-types=""
        data-ff-insurance-description=""
        data-ff-grant-amount=""
        data-ff-apply-url="https://benefitscheckup.org/"
        data-ff-program-url="https://www.ncoa.org/page/benefits-access/"
        data-ff-foundation-url="https://www.ncoa.org/"
        data-ff-contact-email=""
        data-ff-contact-phone=""
        data-ff-metadata='[{"label":"Tool Type","value":"Resource navigator / benefits eligibility screening tool that surfaces other financial assistance programs"},{"label":"Programs Covered","value":"More than 2,000 federal, state, local and private benefits programs across all 50 states and DC"},{"label":"Languages","value":"English and Spanish"}]'
      ></div>
    </div>

    <!-- Foundation Finder mounts here -->
    <div id="foundation-finder-root"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
